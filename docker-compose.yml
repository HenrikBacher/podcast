services:
  drpodcast:
    build: .
    image: ghcr.io/henrikbacher/podcast:latest
    container_name: drpodcast
    ports:
      - "8080:8080"
    environment:
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - REFRESH_INTERVAL_MINUTES=${REFRESH_INTERVAL_MINUTES:-15}
      - TZ=Europe/Copenhagen
    read_only: true
    tmpfs:
      # Writable by the non-root app user (99:100). Docker already defaults tmpfs to 1777;
      # podman mounts it root-owned 755 unless told, and the app then can't create _site/.
      - /app/output:mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
