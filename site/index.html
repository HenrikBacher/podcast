<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="deployment-time" content="{{DEPLOYMENT_TIME}}">
    <meta name="description" content="{{FEED_COUNT}} af DR's podcasts som almindelige RSS-feeds til din egen podcast-app. Uofficiel.">
    <meta property="og:title" content="DR Podcasts">
    <meta property="og:description" content="{{FEED_COUNT}} af DR's podcasts som almindelige RSS-feeds til din egen podcast-app.">
    <meta property="og:type" content="website">
    <title>DR Podcasts</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='5' cy='19' r='2.4' fill='%23e06a1b'/%3E%3Cpath d='M3 10.5a10.5 10.5 0 0 1 10.5 10.5M3 3.5A17.5 17.5 0 0 1 20.5 21' fill='none' stroke='%23e06a1b' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preload" href="fonts/bricolage-grotesque-500.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/instrument-sans-400-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://asset.dr.dk">
    <link rel="stylesheet" href="styles.css?v={{ASSET_VERSION}}">
    <script src="script.js?v={{ASSET_VERSION}}" defer></script>
</head>
<body>
    <div class="wrap">
        <!-- The search bar is the first thing on the page; the heading is for screen readers and search engines. -->
        <h1 class="visually-hidden">DR Podcasts</h1>
        <div class="toolbar" id="toolbar" hidden>
            <div class="toolbar-row">
                <input class="search" id="search" type="search" placeholder="Søg i titler og beskrivelser" aria-label="Søg i podcasts" autocomplete="off" spellcheck="false">
                <div class="sort" role="group" aria-label="Sortering">
                    <button type="button" id="sort-new" aria-pressed="true">Nyeste afsnit</button>
                    <button type="button" id="sort-az" aria-pressed="false">A–Å</button>
                </div>
            </div>
            <div class="chips" id="chips" role="group" aria-label="Emner"></div>
        </div>

        <p class="count" id="count" aria-live="polite"></p>
        <ul class="shelf" id="shelf" data-descriptions="descriptions.json?v={{DESCRIPTIONS_VERSION}}">
            <!-- BEGIN_FEEDS -->
            <!-- END_FEEDS -->
        </ul>
        <p class="empty" id="empty" hidden></p>

        <footer>
            <p>Uofficiel og ikke tilknyttet DR. Lyd, billeder og tekster hentes direkte fra DR.</p>
            <p>Sidst opdateret <time class="deploy-time" datetime="{{DEPLOYMENT_TIME}}">{{DEPLOYMENT_TIME}}</time>.</p>
            <p>Feedene opdateres løbende fra DR. Afsnittene afspilles direkte fra DR’s servere.</p>
        </footer>
    </div>
    <!-- Filled with a copy of the clicked card (script.js), which the card visibly grows into. -->
    <dialog class="details" id="details" aria-labelledby="details-title">
        <div class="details-body">
            <button type="button" class="details-close" id="details-close" aria-label="Luk">×</button>
            <div class="details-card" id="details-card"></div>
        </div>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
