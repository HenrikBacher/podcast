name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "site/**"
      - "Dockerfile"
      - ".github/workflows/build-and-release.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "site/**"
      - "Dockerfile"
      - ".github/workflows/build-and-release.yml"
  schedule:
    - cron: '0 2 * * Wed'

permissions:
  contents: read

# One run per ref at a time. Two quick merges to main would otherwise both read the same latest tag,
# compute the same version, and push it (and :latest) in whichever order their builds finish.
# A superseded PR run is cancelled; a push to main waits for the running one instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "11.0.x"

jobs:
  determine-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gh pr view reads the merged PR's version checkboxes
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-tag: ${{ steps.version.outputs.version-tag }}
      is-release: ${{ steps.version.outputs.is-release }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine Version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Untrusted/context values are passed via env (never interpolated into the
          # script body) so an attacker-controlled PR body can't inject PowerShell.
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: pwsh
        run: |
          $latestTag = git describe --tags --abbrev=0 2>$null
          if (-not $latestTag) {
            $latestTag = "v0.1.0"
            Write-Host "No tags found, using default: $latestTag"
          } else {
            Write-Host "Latest version: $latestTag"
          }

          $version = $latestTag.TrimStart('v')
          $parts = $version -split '\.'
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          $isRelease = "false"
          $bumpType = "patch"

          function Get-BumpTypeFromBody($body) {
            if ($body -match '\[x\]\s+\*\*Major\*\*') { return "major" }
            if ($body -match '\[x\]\s+\*\*Minor\*\*') { return "minor" }
            return "patch"
          }

          function Get-NextVersion($major, $minor, $patch, $bumpType) {
            switch ($bumpType) {
              "major" { return "$($major + 1).0.0" }
              "minor" { return "$major.$($minor + 1).0" }
              default { return "$major.$minor.$($patch + 1)" }
            }
          }

          if ($env:EVENT_NAME -eq "push" -and $env:GIT_REF -eq "refs/heads/main") {
            $isRelease = "true"

            # Ask GitHub which merged PR this commit came from, rather than parsing the commit
            # message: that works for merge, squash and rebase merges alike. (The message parsing
            # broke on multi-line messages: git's output is an array of lines, -match on an array
            # filters instead of setting $matches, and every release silently fell back to PATCH.)
            $prJson = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/pulls" `
              --jq 'map(select(.merged_at != null)) | .[0] // empty | {number, body}' 2>$null
            if ($LASTEXITCODE -eq 0 -and $prJson) {
              $pr = $prJson | ConvertFrom-Json
              $bumpType = Get-BumpTypeFromBody $pr.body
              Write-Host "Merged PR #$($pr.number)"
            } else {
              Write-Host "No merged PR found for $env:GITHUB_SHA, using PATCH (default)"
            }

            $version = Get-NextVersion $major $minor $patch $bumpType
            Write-Host "Release: v$version ($bumpType)"
          } elseif ($env:EVENT_NAME -eq "schedule") {
            # The weekly rebuild exists to ship base-image and SDK security updates, so it publishes:
            # a patch release of main, keeping every pushed image under its own immutable version tag.
            $isRelease = "true"
            $version = Get-NextVersion $major $minor $patch "patch"
            Write-Host "Scheduled rebuild: v$version"
          } else {
            $prNumber = $env:PR_NUMBER
            if (-not $prNumber) { $prNumber = "0" }
            $shortSha = git rev-parse --short=7 HEAD

            try {
              $bumpType = Get-BumpTypeFromBody $env:PR_BODY
            } catch { }

            $nextVersion = Get-NextVersion $major $minor $patch $bumpType
            $version = "$nextVersion-pr$prNumber-$shortSha"
            Write-Host "PR #${prNumber}: $version"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version-tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is-release=$isRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # Docker rejects uppercase repository names, and github.repository keeps the owner's casing.
          "image=ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Tests
        run: dotnet test tests/DrPodcast.Tests/DrPodcast.Tests.csproj --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

  docker:
    needs: [determine-version, test]
    if: needs.determine-version.outputs.is-release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

  # Push to main and the weekly rebuild only: the sole job holding write-scoped permissions.
  release:
    needs: [determine-version, test]
    if: needs.determine-version.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.determine-version.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.determine-version.outputs.version-tag }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Always resolve the base images afresh, so a rebuild picks up their latest patches.
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Generate signed build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.determine-version.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.determine-version.outputs.version-tag }}
          name: Release ${{ needs.determine-version.outputs.version-tag }}
          body: |
            ## Release ${{ needs.determine-version.outputs.version }}

            ${{ github.event_name == 'schedule' && 'Scheduled weekly rebuild of `main`, picking up updated base images.' || '' }}

            ### Docker

            ```bash
            docker pull ${{ needs.determine-version.outputs.image }}:${{ needs.determine-version.outputs.version-tag }}
            ```

            Or use `latest`:

            ```bash
            docker pull ${{ needs.determine-version.outputs.image }}:latest
            ```
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
