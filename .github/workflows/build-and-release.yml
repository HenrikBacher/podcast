name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "site/**"
      - "podcasts.json"
      - "Dockerfile"
      - ".github/workflows/build-and-release.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "site/**"
      - "podcasts.json"
      - "Dockerfile"
      - ".github/workflows/build-and-release.yml"
  schedule:
    - cron: '0 2 * * Wed'

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  determine-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gh pr view reads the merged PR's version checkboxes
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-tag: ${{ steps.version.outputs.version-tag }}
      is-release: ${{ steps.version.outputs.is-release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine Version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Untrusted/context values are passed via env (never interpolated into the
          # script body) so an attacker-controlled PR body can't inject PowerShell.
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: pwsh
        run: |
          $latestTag = git describe --tags --abbrev=0 2>$null
          if (-not $latestTag) {
            $latestTag = "v0.1.0"
            Write-Host "No tags found, using default: $latestTag"
          } else {
            Write-Host "Latest version: $latestTag"
          }

          $version = $latestTag.TrimStart('v')
          $parts = $version -split '\.'
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          $isRelease = "false"
          $bumpType = "patch"

          function Get-BumpTypeFromBody($body) {
            if ($body -match '\[x\]\s+\*\*Major\*\*') { return "major" }
            if ($body -match '\[x\]\s+\*\*Minor\*\*') { return "minor" }
            return "patch"
          }

          function Get-NextVersion($major, $minor, $patch, $bumpType) {
            switch ($bumpType) {
              "major" { return "$($major + 1).0.0" }
              "minor" { return "$major.$($minor + 1).0" }
              default { return "$major.$minor.$($patch + 1)" }
            }
          }

          if ($env:EVENT_NAME -eq "push" -and $env:GIT_REF -eq "refs/heads/main") {
            $isRelease = "true"

            $commitMsg = git log -1 --pretty=%B
            $prMatch = $commitMsg -match '#(\d+)'
            if ($prMatch -and $matches -and $matches.Count -gt 1) {
              $prNumber = $matches[1]
              Write-Host "Merged PR #$prNumber"

              try {
                $prData = gh pr view $prNumber --json body --jq '.body' 2>$null
                if ($prData) { $bumpType = Get-BumpTypeFromBody $prData }
              } catch {
                Write-Host "Could not read PR, using PATCH (default)"
              }
            }

            $version = Get-NextVersion $major $minor $patch $bumpType
            Write-Host "Release: v$version ($bumpType)"
          } else {
            $prNumber = $env:PR_NUMBER
            if (-not $prNumber) { $prNumber = "0" }
            $shortSha = git rev-parse --short=7 HEAD

            try {
              $bumpType = Get-BumpTypeFromBody $env:PR_BODY
            } catch { }

            $nextVersion = Get-NextVersion $major $minor $patch $bumpType
            $version = "$nextVersion-pr$prNumber-$shortSha"
            Write-Host "PR #${prNumber}: $version"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version-tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is-release=$isRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Tests
        run: dotnet test tests/DrPodcast.Tests/DrPodcast.Tests.csproj --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

  docker:
    needs: [determine-version, test]
    if: needs.determine-version.outputs.is-release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

  # Push to main only: the sole job holding write-scoped permissions.
  release:
    needs: [determine-version, test]
    if: needs.determine-version.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.determine-version.outputs.version-tag }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Generate signed build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.determine-version.outputs.version-tag }}
          name: Release ${{ needs.determine-version.outputs.version-tag }}
          body: |
            ## Release ${{ needs.determine-version.outputs.version }}

            ### Docker

            ```bash
            docker pull ${{ env.IMAGE_NAME }}:${{ needs.determine-version.outputs.version-tag }}
            ```

            Or use `latest`:

            ```bash
            docker pull ${{ env.IMAGE_NAME }}:latest
            ```
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
